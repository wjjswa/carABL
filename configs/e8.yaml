# E8: directly fine-tune Majorburn's Carparts-Seg pretrained YOLO11 backbone.
# Separate full-data classification runs: 8 classes (including unknown), 7 classes (excluding unknown).
# All 300 epochs run; overfitting is monitored, not used for early stopping.
manifest: data/prepared/manifest.csv
data_root: data/kaggle
output: outputs/e8
device: cuda
workers: 4
batch_size: 16
image_size: 384
epochs: 300
seeds: [0, 1, 2]
lr: 0.0001
head_lr: 0.001
weight_decay: 0.0001
pretrained:
  repository: Majorburn/yolov11-carparts-seg
  revision: f26ca7107b40dd9a385ea82fd2fef8a3d6044dc7
  filename: best.pt
  checkpoint: weights/carparts/majorburn_yolo11_carparts_seg.pt
  expected_classes: 23
overfitting:
  window: 15
  min_train_loss_improvement: 0.02
  min_val_loss_worsening: 0.02
  min_val_train_loss_ratio: 1.30
  min_accuracy_gap: 0.15
