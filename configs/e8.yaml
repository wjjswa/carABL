# E8: shared Carparts-Seg part-pretrained YOLOv8s backbone -> 8-class and 7-class full fine-tuning.
# Keep the established group-disjoint carABL manifest unchanged. No training-fraction experiments.
manifest: data/prepared/manifest.csv
data_root: data/kaggle
output: outputs/e8
device: cuda
workers: 4
batch_size: 16
image_size: 384
epochs: 300
seeds: [0, 1, 2]
lr: 0.0001
head_lr: 0.001
weight_decay: 0.0001
# Overfitting checking is observational: always run 300 epochs (no automatic early stop).
overfit_window: 15
overfit_min_train_improvement: 0.02
overfit_min_val_worsening: 0.02
overfit_loss_ratio: 1.30
segmentation:
  # Initial general-purpose weights: NOT already trained on Carparts-Seg.
  init_checkpoint: yolov8s-seg.pt
  data: carparts-seg.yaml
  epochs: 300
  image_size: 640
  batch_size: 16
  patience: 301
  seed: 0
  # Relative to output root. After part pretraining this file must exist:
  checkpoint: outputs/e8/part_seg/seed0/weights/best.pt
